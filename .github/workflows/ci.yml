name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Proxy worker tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax
        run: for f in web/js/*.js web/config.js proxy/worker.js; do node --check --input-type=module < "$f"; done
